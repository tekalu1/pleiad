# macOS 専用 API の型検査と universal バイナリの検証。TCC・画面・入力は実機で別に確かめる。
name: Computer macOS helper
on:
  push:
    branches: [main]
    paths: &paths
      - 'desktop/computer/**'
      - 'scripts/build-computer-mac.cjs'
      - 'electron-builder.yml'
      - 'build/entitlements.mac.plist'
      - '.github/workflows/computer-mac-helper.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: computer-mac-helper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          swift --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test protocol and compile macOS sources
        working-directory: desktop/computer/mac
        run: swift test
      - name: Build and verify universal helper
        run: node scripts/build-computer-mac.cjs
